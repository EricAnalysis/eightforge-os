name: Ask Phase 3 Diagnostic

on:
  pull_request:
    paths:
      - 'lib/ask/**'
      - 'app/api/ask/**'
      - 'components/ask/**'
      - 'components/platform/AskEightForgeResponsePanel.tsx'
      - 'lib/projectFacts.ts'
      - 'lib/execution/executionSummary.ts'
      - 'scripts/ask/**'
      - '.github/workflows/ask-phase3-diagnostic.yml'
  workflow_dispatch:

jobs:
  ask-phase3-diagnostic:
    name: Ask regression harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run versioned hermetic correctness first pass
        run: npx vitest run --config scripts/ask/vitest.hermetic.config.ts --pool forks
      - name: Capture first pass
        run: cp scripts/ask/artifacts/hermetic-correctness.json /tmp/ask-hermetic-first.json
      - name: Run versioned hermetic correctness second pass
        run: npx vitest run --config scripts/ask/vitest.hermetic.config.ts --pool forks
      - name: Enforce identity, correctness, and repeatability
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const first = JSON.parse(fs.readFileSync('/tmp/ask-hermetic-first.json', 'utf8'));
          const second = JSON.parse(fs.readFileSync('scripts/ask/artifacts/hermetic-correctness.json', 'utf8'));
          const pin = JSON.parse(fs.readFileSync('scripts/ask/diagnosticIdentity.json', 'utf8'));
          for (const run of [first, second]) {
            assert.equal(run.corpusVersion, pin.corpusVersion);
            assert.equal(run.corpusSha256, pin.corpusSha256);
            assert.equal(run.fixtureVersion, pin.fixtureVersion);
            assert.equal(run.inputSha256, pin.inputSha256);
            assert.equal(run.contractSha256, pin.contractSha256);
            assert.equal(run.records.length, 60);
            assert.equal(run.expectedMaterialCoverage, pin.expectedMaterialCoverage);
            assert.equal(run.expectedRefusalCoverage, pin.expectedRefusalCoverage);
            assert.equal(run.correctnessFailures, 0);
          }
          assert.deepEqual(first, second, 'Hermetic artifacts must be byte-equivalent data without timestamp normalization');
          NODE
      - name: Upload correctness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ask-hermetic-correctness
          path: scripts/ask/artifacts/hermetic-correctness.json
