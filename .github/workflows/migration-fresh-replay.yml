name: Migration Fresh Replay

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/verify-step0-migration-replay.sh'
      - '.github/workflows/migration-fresh-replay.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'scripts/verify-step0-migration-replay.sh'
      - '.github/workflows/migration-fresh-replay.yml'

jobs:
  migration-fresh-replay:
    name: Fresh Postgres migration replay
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply Supabase compatibility stubs
        run: |
          set -Eeuo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY,
            email text
          );
          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $$
            SELECT NULL::uuid;
          $$;
          CREATE OR REPLACE FUNCTION auth.role()
          RETURNS text
          LANGUAGE sql
          STABLE
          AS $$
            SELECT current_setting('request.jwt.claim.role', true);
          $$;
          DO $$
          BEGIN
            CREATE ROLE authenticated NOLOGIN;
          EXCEPTION WHEN duplicate_object THEN
            NULL;
          END $$;
          DO $$
          BEGIN
            CREATE ROLE anon NOLOGIN;
          EXCEPTION WHEN duplicate_object THEN
            NULL;
          END $$;
          -- service_role must carry BYPASSRLS to match hosted Supabase. The
          -- deferred constraint triggers that enforce extraction dependency
          -- closure are SECURITY INVOKER and fire at COMMIT, outside the
          -- SECURITY DEFINER publisher that queued them, so they evaluate as
          -- the session role. Without BYPASSRLS the RLS SELECT policies (which
          -- are granted TO authenticated only) hide the very rows the invariant
          -- counts, and the check fails against valid data.
          DO $$
          BEGIN
            CREATE ROLE service_role NOLOGIN BYPASSRLS;
          EXCEPTION WHEN duplicate_object THEN
            ALTER ROLE service_role BYPASSRLS;
          END $$;
          GRANT USAGE ON SCHEMA auth TO authenticated, anon, service_role;
          GRANT EXECUTE ON FUNCTION auth.uid(), auth.role() TO authenticated, anon, service_role;
          SQL

      - name: Replay migrations and verify Step 0 database invariants
        run: |
          set -Eeuo pipefail
          STEP0_REPLAY_DATABASE_URL='postgresql://postgres:postgres@localhost:5432/postgres' \
            bash scripts/verify-step0-migration-replay.sh
