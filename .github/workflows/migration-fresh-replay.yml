name: Migration Fresh Replay

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/verify-step0-migration-replay.sh'
      - 'scripts/sql/**'
      - 'scripts/verify-approved-engineering-request-from-postgres.ts'
      - 'scripts/verify-phase12-effective-recovery-from-postgres.ts'
      - 'scripts/verify-phase13-recovery-v2-from-postgres.ts'
      - 'scripts/verify-phase14-recovery-target-context-from-postgres.ts'
      - 'scripts/verify-phase15-diagnostics-from-postgres.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - 'lib/extraction/domain/hash.ts'
      - 'lib/extraction/recovery/**'
      - 'lib/approvedEngineeringRequest.ts'
      - 'lib/forgewingConfirmedRecovery.ts'
      - 'lib/forgewingRecoveryReview.ts'
      - 'lib/workflowEngineeringReview.ts'
      - 'lib/repositoryAwareImplementationPlan.ts'
      - 'lib/repositoryPlanContent.ts'
      - 'lib/repositoryPlanEvidence.ts'
      - 'lib/repositoryPlanFoundation.ts'
      - 'lib/repositoryPlanGuidance.ts'
      - 'lib/repositoryPlanSnapshot.ts'
      - 'lib/workflowImplementationPlan.ts'
      - 'lib/workflowImplementationPlanWire.ts'
      - 'lib/workflowReviewedSpecification.ts'
      - 'lib/server/approvedEngineeringRequestRead.ts'
      - 'lib/server/effectiveRecoveryConfirmations.ts'
      - 'lib/server/forgewingRecoveryProposalPersistence.ts'
      - 'lib/server/forgewingRecoveryReview.ts'
      - 'lib/server/supabaseAdmin.ts'
      - 'lib/server/workflowEngineeringReview.ts'
      - 'lib/server/workflowPlatformReviewAccess.ts'
      - 'lib/server/workflowRepositoryPlanPersistence.ts'
      - 'lib/server/workflowRepositoryPlanRead.ts'
      - '.github/workflows/migration-fresh-replay.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'scripts/verify-step0-migration-replay.sh'
      - 'scripts/sql/**'
      - 'scripts/verify-approved-engineering-request-from-postgres.ts'
      - 'scripts/verify-phase12-effective-recovery-from-postgres.ts'
      - 'scripts/verify-phase13-recovery-v2-from-postgres.ts'
      - 'scripts/verify-phase14-recovery-target-context-from-postgres.ts'
      - 'scripts/verify-phase15-diagnostics-from-postgres.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - 'lib/extraction/domain/hash.ts'
      - 'lib/extraction/recovery/**'
      - 'lib/approvedEngineeringRequest.ts'
      - 'lib/forgewingConfirmedRecovery.ts'
      - 'lib/forgewingRecoveryReview.ts'
      - 'lib/workflowEngineeringReview.ts'
      - 'lib/repositoryAwareImplementationPlan.ts'
      - 'lib/repositoryPlanContent.ts'
      - 'lib/repositoryPlanEvidence.ts'
      - 'lib/repositoryPlanFoundation.ts'
      - 'lib/repositoryPlanGuidance.ts'
      - 'lib/repositoryPlanSnapshot.ts'
      - 'lib/workflowImplementationPlan.ts'
      - 'lib/workflowImplementationPlanWire.ts'
      - 'lib/workflowReviewedSpecification.ts'
      - 'lib/server/approvedEngineeringRequestRead.ts'
      - 'lib/server/effectiveRecoveryConfirmations.ts'
      - 'lib/server/forgewingRecoveryProposalPersistence.ts'
      - 'lib/server/forgewingRecoveryReview.ts'
      - 'lib/server/supabaseAdmin.ts'
      - 'lib/server/workflowEngineeringReview.ts'
      - 'lib/server/workflowPlatformReviewAccess.ts'
      - 'lib/server/workflowRepositoryPlanPersistence.ts'
      - 'lib/server/workflowRepositoryPlanRead.ts'
      - '.github/workflows/migration-fresh-replay.yml'

jobs:
  migration-fresh-replay:
    name: Phase 1B Postgres regression
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply Supabase compatibility stubs
        run: |
          set -Eeuo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS extensions;
          CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA extensions;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY,
            email text
          );
          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $$
            SELECT NULL::uuid;
          $$;
          CREATE OR REPLACE FUNCTION auth.role()
          RETURNS text
          LANGUAGE sql
          STABLE
          AS $$
            SELECT current_setting('request.jwt.claim.role', true);
          $$;
          DO $$
          BEGIN
            CREATE ROLE authenticated NOLOGIN;
          EXCEPTION WHEN duplicate_object THEN
            NULL;
          END $$;
          DO $$
          BEGIN
            CREATE ROLE anon NOLOGIN;
          EXCEPTION WHEN duplicate_object THEN
            NULL;
          END $$;
          -- service_role must carry BYPASSRLS to match hosted Supabase.
          -- Dependency-closure checks are separately hardened against caller
          -- RLS visibility; keep both protections so replay fidelity and
          -- database-integrity correctness remain independently enforced.
          DO $$
          BEGIN
            CREATE ROLE service_role NOLOGIN BYPASSRLS;
          EXCEPTION WHEN duplicate_object THEN
            ALTER ROLE service_role BYPASSRLS;
          END $$;
          GRANT USAGE ON SCHEMA auth TO authenticated, anon, service_role;
          GRANT EXECUTE ON FUNCTION auth.uid(), auth.role() TO authenticated, anon, service_role;
          SQL

      - name: Replay migrations and verify durable database invariants
        run: |
          set -Eeuo pipefail
          STEP0_REPLAY_DATABASE_URL='postgresql://postgres:postgres@localhost:5432/postgres' \
            bash scripts/verify-step0-migration-replay.sh
