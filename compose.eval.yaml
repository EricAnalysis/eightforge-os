# EightForge pinned evaluation run (Dockerfile.eval). Evaluation only; the
# application development stack is unaffected. See
# docs/testing/docker-evaluation-runtime.md.
#
# Build first:  node scripts/evaluation/docker/build-eval-image.mjs
# Then:
#   EIGHTFORGE_EVAL_CORPUS=<dir with the pinned PDFs> \
#   EIGHTFORGE_EVAL_PINS=<pins.json> \
#   EIGHTFORGE_EVAL_OUT=<empty artifact dir, outside the corpus and the repo> \
#   EIGHTFORGE_EVAL_IMAGE_ID=<printed by the build> \
#   docker compose -f compose.eval.yaml run --rm eightforge-eval
#
# No env_file: no application, database, provider or deployment credentials
# reach this container. No network. The corpus and pins are read-only.
services:
  eightforge-eval:
    # The image that runs is exactly the one the manifest records: never a
    # moving tag such as :local, which names whatever was built last.
    image: ${EIGHTFORGE_EVAL_IMAGE_ID:?set EIGHTFORGE_EVAL_IMAGE_ID to the sha256 image id printed by the build}
    platform: linux/amd64
    network_mode: none
    environment:
      EIGHTFORGE_EVAL_IMAGE_ID: ${EIGHTFORGE_EVAL_IMAGE_ID}
    volumes:
      - type: bind
        source: ${EIGHTFORGE_EVAL_CORPUS:?set EIGHTFORGE_EVAL_CORPUS to the pinned PDF directory}
        target: /corpus
        read_only: true
      - type: bind
        source: ${EIGHTFORGE_EVAL_PINS:?set EIGHTFORGE_EVAL_PINS to the pins file}
        target: /pins/pins.json
        read_only: true
      - type: bind
        source: ${EIGHTFORGE_EVAL_OUT:?set EIGHTFORGE_EVAL_OUT to an empty artifact directory}
        target: /artifacts
